{# 日ごとの一覧・アイコンのホームの見た目（職員の画面） #}
<style>
  .daywrap { max-width: 720px; margin: 0 auto; }
  .daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #e6e1d8; border-radius: 14px; padding: 8px; }
  .daynav-btn { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 12px; background: #f3f0ea; color: #333; font-size: 1.5rem; text-decoration: none; flex: 0 0 auto; }
  .daynav-btn:hover { background: #e6e1d7; color: #111; }
  .daynav-day { text-align: center; min-width: 0; }
  .daynav-date { font-size: 1.25rem; font-weight: 700; }
  .daynav-today { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--color-primary, #4e7ea8); color: #fff; font-size: .75rem; vertical-align: middle; }
  .daynav-sub { font-size: .8rem; color: #777; }
  .daynav-tools { display: flex; justify-content: flex-end; gap: 8px; margin: 6px 0 12px; }
  .daylist { list-style: none; margin: 0; padding: 0; }
  .daylist li + li { margin-top: 6px; }
  .dayitem { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff; border: 1px solid #e6e1d8; border-radius: 12px; color: inherit; text-decoration: none; min-height: 56px; }
  a.dayitem:hover { border-color: var(--color-primary, #4e7ea8); color: inherit; }
  .dayitem-name { font-size: 1.05rem; font-weight: 700; flex: 1 1 auto; min-width: 0; }
  .dayitem-name small { font-weight: 400; color: #777; }
  .dayitem-state { flex: 0 0 auto; font-size: .82rem; padding: 2px 10px; border-radius: 999px; background: #f1eee8; color: #555; white-space: nowrap; }
  .dayitem-state.is-done { background: #e3f3e6; color: #1e6b33; }
  .dayitem-state.is-draft { background: #fff3d6; color: #8a5a00; }
  .dayitem.is-absent { background: #ececec; border-color: #dcdcdc; color: #777; }
  .dayitem.is-absent .dayitem-name { font-weight: 400; }
  .daylist-head { font-size: .82rem; color: #777; margin: 14px 2px 6px; }
  .day-empty { text-align: center; color: #777; background: #fff; border: 1px dashed #d9d3c8; border-radius: 12px; padding: 28px 12px; }
  .iconhome { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 560px; margin: 8px auto 0; }
  .iconhome a { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; padding: 18px 6px 14px; background: #fff; border: 1px solid #e6e1d8; border-radius: 18px; text-decoration: none; color: #2f2a24; text-align: center; position: relative; min-height: 132px; }
  .iconhome a:hover, .iconhome a:focus-visible { border-color: var(--color-primary, #4e7ea8); box-shadow: 0 2px 8px rgba(0,0,0,.08); color: #2f2a24; }
  .iconhome .ih-icon { display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 18px; background: var(--color-primary-bg, #eef3f8); color: var(--color-primary, #4e7ea8); font-size: 2.3rem; }
  .iconhome .ih-label { font-size: .98rem; font-weight: 700; line-height: 1.25; white-space: pre-line; }
  .iconhome .ih-soon { position: absolute; top: 8px; right: 8px; font-size: .68rem; padding: 1px 7px; border-radius: 999px; background: #f1eee8; color: #777; }
  @media (max-width: 420px) { .iconhome { gap: 10px; } .iconhome a { min-height: 120px; padding: 14px 4px 12px; } .iconhome .ih-icon { width: 58px; height: 58px; font-size: 2rem; } .iconhome .ih-label { font-size: .88rem; } }
</style>
