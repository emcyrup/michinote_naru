<li>
  <a class="dayitem {% if absent %}is-absent{% elif r.book and r.book.is_sent %}is-sent{% endif %}" href="{% url 'family:staff_book_edit' r.beneficiary.pk %}?date={{ day|date:'Y-m-d' }}">
    <span class="dayitem-name">{{ r.beneficiary.full_name }} <small>さん</small></span>
    <span class="dayitem-marks">
      {% if r.notes %}<span class="dayitem-state is-note"><i class="bi bi-chat-left-text"></i> 保護者より</span>{% endif %}
      {% if r.book and r.book.is_sent %}
        {% if r.book.is_read %}<span class="dayitem-state is-read"><i class="bi bi-check2-all"></i> 送信済み・保護者確認済み</span>
        {% else %}<span class="dayitem-state is-done"><i class="bi bi-check-circle-fill"></i> 送信済み</span>{% endif %}
      {% elif r.book and r.book.body %}<span class="dayitem-state is-draft"><i class="bi bi-pencil-fill"></i> 下書き</span>
      {% elif absent %}<span class="dayitem-state">欠席</span>
      {% else %}<span class="dayitem-state">まだ</span>{% endif %}
    </span>
    <i class="bi bi-chevron-right text-muted" aria-hidden="true"></i>
  </a>
</li>
