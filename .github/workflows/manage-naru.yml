# =============================================
# 事業所「成」（職員向け）の環境での管理コマンド（Actions の画面から実行する）
#   target で開発（dev：st-naru.ai-labo.cloud）か本番（prod：naru.ai-labo.cloud）を選ぶ。
#   Deploy (naru) と同じ Secrets で SSH し、~/michinotenaru の manage.py を実行する（手順は docs/DEPLOY_NARU.md）
#   - create_facility : 事業所と管理者を作る（--preset houdei）。with_demo は開発だけ（本番には見本のデータを入れない）
#   - set_password    : 管理者（職員）のパスワードを設定する
#   - list            : 事業所の一覧を表示する
#   - family_page_on / family_page_off : 職員のホームをアイコンの並びにし、保護者ページを使う／やめる（facility_id）
#   - status / autostart_check / autostart_install / backup / backup_list / backup_check / error_log / login_log / set_media_root
#   - security_check  : 診断（読み取りだけ）。サーバーの中の設定・権限と、外から見える応答（HTTPS・ヘッダー・出てはいけないファイル）を確かめる
#   - disable_logins / enable_logins : その事業所の職員アカウントをまとめて無効／有効にする（facility_id）
#   - delete_facility・seed_demo・seed_demo_reset・billing_demo・billing_demo_remove : 開発だけ（本番では止める）
#
# パスワードは入力欄では受け取らない（入力欄の値は公開のログにそのまま出るため）。
# Secrets の NARU_DEV_ADMIN_PASSWORD／NARU_PROD_ADMIN_PASSWORD を使う（無ければ NARU_ADMIN_PASSWORD）。
# 空なら create_facility はランダムな仮の値にする。このリポジトリは公開なので、ログに秘密の値を出さないこと。
# =============================================
name: Manage (naru)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "環境（dev＝開発 st-naru.ai-labo.cloud／prod＝本番 naru.ai-labo.cloud）"
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      app:
        description: "どちらの置き場所で実行するか（staff＝職員向け／family＝保護者向け。family は status・autostart_*・error_log・login_log だけ）"
        type: choice
        required: true
        default: staff
        options: [staff, family]
      task:
        description: "実行する作業"
        type: choice
        required: true
        default: list
        options: [create_facility, set_password, list, delete_facility, seed_demo, seed_demo_reset, billing_demo, billing_demo_remove, error_log, login_log, set_media_root, status, autostart_check, autostart_install, backup, backup_list, backup_check, disable_logins, enable_logins, family_page_on, family_page_off, security_check]
      facility_name:
        description: "事業所名（create_facility）"
        type: string
        default: "成"
      admin_username:
        description: "管理者のユーザー名（create_facility・set_password）"
        type: string
        default: naru
      with_demo:
        description: "見本のデータも入れる（create_facility。開発だけ。本番では無視する）"
        type: boolean
        default: false
      facility_id:
        description: "施設 ID（family_page_on/off・disable_logins・enable_logins・delete_facility など。list で確かめる）"
        type: string
        default: ""
      copy_from:
        description: "設定を写す元の施設 ID（create_facility。同じ DB の中の事業所だけ。通常は空）"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  manage:
    runs-on: ubuntu-latest
    # 本番と開発で GitHub の Environment を分ける（本番だけの Secrets・承認・使えるブランチの決まりを付けられる。docs/DEPLOY_NARU.md）
    environment: ${{ inputs.target == 'prod' && 'naru-prod' || 'naru-dev' }}
    concurrency:
      group: deploy-naru-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      # 配備先のサーバーを選ぶ。本番は NARU_PROD_* だけ（ほかの Secrets で代えない：取り違えを防ぐ）
      - name: Set up SSH
        env:
          TARGET: ${{ inputs.target }}
          DEV_HOST: ${{ secrets.NARU_DEV_DEPLOY_HOST || secrets.HOUDEIDEMO_DEPLOY_HOST || secrets.DEV_DEPLOY_HOST }}
          DEV_USER: ${{ secrets.NARU_DEV_DEPLOY_USER || secrets.HOUDEIDEMO_DEPLOY_USER || secrets.DEV_DEPLOY_USER }}
          DEV_KEY: ${{ secrets.NARU_DEV_DEPLOY_SSH_KEY || secrets.HOUDEIDEMO_DEPLOY_SSH_KEY || secrets.DEV_DEPLOY_SSH_KEY }}
          DEV_PORT: ${{ secrets.NARU_DEV_DEPLOY_SSH_PORT || secrets.HOUDEIDEMO_DEPLOY_SSH_PORT || secrets.DEV_DEPLOY_SSH_PORT || '22' }}
          PROD_HOST: ${{ secrets.NARU_PROD_DEPLOY_HOST }}
          PROD_USER: ${{ secrets.NARU_PROD_DEPLOY_USER }}
          PROD_KEY: ${{ secrets.NARU_PROD_DEPLOY_SSH_KEY }}
          PROD_PORT: ${{ secrets.NARU_PROD_DEPLOY_SSH_PORT || '22' }}
          DEV_HOST_KEY: ${{ secrets.NARU_DEV_SSH_HOST_KEY }}
          PROD_HOST_KEY: ${{ secrets.NARU_PROD_SSH_HOST_KEY }}
        run: |
          if [ "$TARGET" = "prod" ]; then H="$PROD_HOST"; U="$PROD_USER"; K="$PROD_KEY"; P="$PROD_PORT"; N="NARU_PROD_DEPLOY_HOST・NARU_PROD_DEPLOY_USER・NARU_PROD_DEPLOY_SSH_KEY"
          else H="$DEV_HOST"; U="$DEV_USER"; K="$DEV_KEY"; P="$DEV_PORT"; N="NARU_DEV_DEPLOY_HOST・NARU_DEV_DEPLOY_USER・NARU_DEV_DEPLOY_SSH_KEY"; fi
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$K" ]; then
            echo "SSH の Secrets（$N）が未登録です（docs/DEPLOY_NARU.md の「GitHub Secrets」）"; exit 1
          fi
          mkdir -p ~/.ssh
          # Windows の改行（CR）が混ざっていても読めるようにする
          printf '%s\n' "$K" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 鍵を確かめる（指紋は公開鍵のもので、秘密ではない。サーバーの authorized_keys と見比べるために出す）
          if ! head -n 1 ~/.ssh/deploy_key | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
            echo "ERROR: SSH の鍵の Secrets が秘密鍵の形ではありません（-----BEGIN … PRIVATE KEY----- の行から -----END … の行まで、全文を入れてください。公開鍵（ssh-ed25519 … や ssh-rsa … の 1 行）ではありません）"; exit 1
          fi
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "ERROR: SSH の秘密鍵を読めません（途中で切れている・改行が抜けている・パスフレーズつき のどれか。パスフレーズなしの鍵の全文を入れてください）"; exit 1
          fi
          echo "使う鍵の指紋（公開鍵）: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | awk '{print $2, $NF}')"
          echo "  サーバーで ssh-keygen -lf ~/.ssh/authorized_keys を実行して、同じ指紋の行があるか見比べられます"
          # サーバーのホスト鍵。Secrets に登録してあれば、それだけを信じる（なりすましたサーバーへはつながない）
          if [ "$TARGET" = "prod" ]; then HK="$PROD_HOST_KEY"; HKN="NARU_PROD_SSH_HOST_KEY"; else HK="$DEV_HOST_KEY"; HKN="NARU_DEV_SSH_HOST_KEY"; fi
          : > ~/.ssh/known_hosts
          if [ -n "$HK" ]; then
            if [ "$P" = "22" ]; then HN="$H"; else HN="[$H]:$P"; fi
            # 1 行に「鍵の種類 鍵」（例：ssh-ed25519 AAAA…）。先頭にホスト名が付いていても、うしろの 2 つだけを使う
            printf '%s\n' "$HK" | tr -d '\r' | grep -oE '(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) +[A-Za-z0-9+/=]+' | while read -r T B; do echo "$HN $T $B"; done >> ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "ERROR: $HKN の形が読めません（サーバーの /etc/ssh/ssh_host_ed25519_key.pub の中身「ssh-ed25519 AAAA…」を入れてください）"; exit 1; }
            if ! ssh-keyscan -p "$P" "$H" 2>/dev/null | awk '{print $2, $3}' | grep -qxFf <(awk '{print $2, $3}' ~/.ssh/known_hosts); then
              echo "ERROR: サーバーのホスト鍵が、登録してある $HKN と合いません（サーバーを入れ替えた・鍵を作り直したなら Secrets を直す。心当たりがなければ、つながずに原因を確かめてください）"; exit 1
            fi
            echo "ホスト鍵: 登録してある鍵（$HKN）と合いました"
          else
            ssh-keyscan -p "$P" -H "$H" >> ~/.ssh/known_hosts 2>/dev/null
            [ -s ~/.ssh/known_hosts ] || { echo "ERROR: サーバーに届きません（ホスト名の Secrets か SSH のポートを確かめてください）"; exit 1; }
            echo "::notice::ホスト鍵は固定していません（$HKN が未登録）。その場で受け取った鍵を信じてつないでいます。登録のしかたは docs/DEPLOY_NARU.md"
          fi
          # 先に入れるか確かめる（入れないときに、理由を分かる形で止める）
          if ! ssh -v -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$P" "$U@$H" true 2> ~/.ssh/err.txt; then
            # 理由の手がかりだけ出す（ホスト名・ユーザー名の入る行は出さない）
            grep -E 'Permission denied|no mutual signature|Authentications that can continue|Server accepts key|Connection (refused|timed out|closed)' ~/.ssh/err.txt | sed -E 's/^debug1: //; s/^[^:]*@[^:]*: //' | sort -u | tail -n 6
            # 古いサーバー（RSA の鍵を SHA-1 の署名でしか受けない）かどうかを確かめる
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa -p "$P" "$U@$H" true 2>/dev/null; then
              echo "参考: 古い署名の方式（ssh-rsa）を許すと入れます。サーバーの OpenSSH が古いので、ed25519 の鍵に替えるのがよいです"
            fi
            echo "ERROR: サーバーに SSH で入れません。上の指紋の公開鍵が、Secrets のユーザーの ~/.ssh/authorized_keys に入っているか、ユーザー名・ホスト名の Secrets が合っているかを確かめてください"; exit 1
          fi
          echo "SSH: OK"
          { echo "SSH_HOST=$H"; echo "SSH_USER=$U"; echo "SSH_PORT=$P"; } >> "$GITHUB_ENV"

      - name: Run manage.py on the server
        env:
          TARGET: ${{ inputs.target }}
          APP: ${{ inputs.app }}
          TASK: ${{ inputs.task }}
          FACILITY_NAME: ${{ inputs.facility_name }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
          PW_DEV: ${{ secrets.NARU_DEV_ADMIN_PASSWORD || secrets.NARU_ADMIN_PASSWORD }}
          PW_PROD: ${{ secrets.NARU_PROD_ADMIN_PASSWORD || secrets.NARU_ADMIN_PASSWORD }}
          WITH_DEMO: ${{ inputs.with_demo }}
          FACILITY_ID: ${{ inputs.facility_id }}
          COPY_FROM: ${{ inputs.copy_from }}
          REMOTE_APP_DIR: ${{ secrets.NARU_APP_DIR || '~/michinotenaru' }}
          REMOTE_VENV: ${{ secrets.NARU_VENV || '~/envnaru' }}
        run: |
          if [ "$APP" = "family" ]; then
            # 保護者向けの置き場所では、起動まわりとログだけ（データの作業・バックアップは DB を共用する職員向けの側で）
            case "$TASK" in status|autostart_check|autostart_install|error_log|login_log|security_check) ;;
              *) echo "app=family で実行できるのは status・autostart_check・autostart_install・error_log・login_log だけです（ほかは app=staff で）"; exit 1;; esac
            REMOTE_APP_DIR="${REMOTE_APP_DIR}family"; REMOTE_VENV="${REMOTE_VENV}family"
          fi
          if [ "$TARGET" = "prod" ]; then
            ADMIN_PASSWORD="$PW_PROD"; SECRET_NAME=NARU_PROD_ADMIN_PASSWORD
            # 本番には見本のデータを入れない・事業所を消さない
            case "$TASK" in delete_facility|seed_demo|seed_demo_reset|billing_demo|billing_demo_remove)
              echo "本番（prod）では $TASK は実行できません（見本のデータの出し入れ・事業所の削除は開発だけ）"; exit 1;; esac
            WITH_DEMO=false
          else
            ADMIN_PASSWORD="$PW_DEV"; SECRET_NAME=NARU_DEV_ADMIN_PASSWORD
          fi
          [[ "$ADMIN_USERNAME" =~ ^[A-Za-z0-9_.-]{1,60}$ ]] || { echo "admin_username は英数字で入れてください"; exit 1; }
          [[ "$FACILITY_ID" =~ ^[0-9]*$ ]] && [[ "$COPY_FROM" =~ ^[0-9]*$ ]] || { echo "facility_id・copy_from は数字で入れてください"; exit 1; }
          if [ "$TASK" = "create_facility" ] && [ -z "$ADMIN_PASSWORD" ]; then
            echo "注意: Secrets の $SECRET_NAME（または NARU_ADMIN_PASSWORD）が空なので、管理者のパスワードはランダムな仮の値になります。あとで Secrets を登録して set_password を実行してください"
          fi
          if [ "$TASK" = "set_password" ] && [ -z "$ADMIN_PASSWORD" ]; then
            echo "Secrets の $SECRET_NAME（または NARU_ADMIN_PASSWORD）が空です。先に Settings → Secrets and variables → Actions で登録してください（入力欄では受け取りません）"; exit 1
          fi

          if [ -n "$ADMIN_PASSWORD" ]; then
            echo "::add-mask::$ADMIN_PASSWORD"
          else
            ADMIN_PASSWORD=$(openssl rand -base64 24)
            echo "::add-mask::$ADMIN_PASSWORD"
          fi
          # 秘密の値はコマンド行に出さず、ssh の標準入力（スクリプトの先頭）で渡す
          {
            printf 'TASK=%q\nFACILITY_NAME=%q\nADMIN_USERNAME=%q\nADMIN_PASSWORD=%q\nWITH_DEMO=%q\nFACILITY_ID=%q\nCOPY_FROM=%q\nAPP_DIR_IN=%q\nVENV_IN=%q\n' \
              "$TASK" "$FACILITY_NAME" "$ADMIN_USERNAME" "$ADMIN_PASSWORD" "$WITH_DEMO" "$FACILITY_ID" "$COPY_FROM" "$REMOTE_APP_DIR" "$REMOTE_VENV"
            cat <<'REMOTE'
            set -euo pipefail
            # 公開のログにサーバーのホームのパス（SSH のユーザー名が入る）を出さない：出力の中のホームを ~ に置き換える
            exec > >(sed -u "s#$HOME#~#g") 2>&1
            export ADMIN_USERNAME ADMIN_PASSWORD
            APP_DIR=$(eval echo "$APP_DIR_IN"); VENV=$(eval echo "$VENV_IN")
            [ -f "$VENV/bin/activate" ] || { echo "ERROR: この環境はまだ配備されていません。先に Deploy (naru) を実行してください"; exit 1; }
            # shellcheck disable=SC1091
            source "$VENV/bin/activate"
            cd "$APP_DIR"
            test -f .env || { echo "ERROR: $APP_DIR/.env がありません"; exit 1; }
            set_password() {
              # パスワードは引数に出さず、環境変数から読む
              python manage.py shell -c "import os; from accounts.models import StaffAccount; u = StaffAccount.objects.get(username=os.environ['ADMIN_USERNAME']); u.set_password(os.environ['ADMIN_PASSWORD']); u.save(update_fields=['password']); print('パスワードを設定しました:', u.username)"
            }
            case "$TASK" in
              create_facility)
                args=(create_facility "$FACILITY_NAME" --admin "$ADMIN_USERNAME" --password "$(openssl rand -base64 18)" --preset houdei)
                [ -n "$COPY_FROM" ] && args+=(--copy-settings-from "$COPY_FROM")
                [ "$WITH_DEMO" = "true" ] && args+=(--demo)
                python manage.py "${args[@]}"
                set_password
                ;;
              set_password)
                set_password ;;
              list)
                python manage.py shell -c "from facilities.models import Facility; [print(f.pk, f.name, '| 型:', f.layout, '| 様式:', f.form_set, '| 請求:', f.use_billing, '| 予約:', f.use_reservation) for f in Facility.objects.order_by('pk')] or print('事業所はまだありません')"
                python manage.py shell -c "from accounts.models import StaffAccount; [print(' 職員:', u.username, '|', u.facility_id, '|', u.get_role_display()) for u in StaffAccount.objects.order_by('pk')]" ;;
              delete_facility)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください"; exit 1; }
                python manage.py delete_facility "$FACILITY_ID" --yes ;;
              seed_demo)
                args=(seed_demo --reset); [ -n "$FACILITY_ID" ] && args+=(--facility "$FACILITY_ID")
                python manage.py "${args[@]}" ;;
              seed_demo_reset)
                FACILITY_ID="$FACILITY_ID" python manage.py shell -c "import os, sys; from facilities.models import Facility; from facilities.management.commands.seed_demo import Command; fid = os.environ.get('FACILITY_ID') or ''; qs = Facility.objects.filter(pk=fid) if fid else Facility.objects.all(); qs.count() == 1 or sys.exit('施設を1つに絞ってください（facility_id）: ' + ', '.join(f'{f.pk}:{f.name}' for f in Facility.objects.all())); f = qs.get(); print('サンプルデータを消します:', f.pk, f.name); Command()._reset(f)" ;;
              billing_demo)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください（list で確認）"; exit 1; }
                python manage.py billing_demo --facility "$FACILITY_ID" ;;
              billing_demo_remove)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください"; exit 1; }
                python manage.py billing_demo --facility "$FACILITY_ID" --remove ;;
              login_log)
                echo "== /accounts/login/ への送信（access.log、直近 7 日。302＝ログインできた・200＝画面に戻った（失敗・ロック）・403＝CSRF）=="
                since=$(date -d '7 days ago' '+%Y-%m-%d' 2>/dev/null || echo 0000-00-00)
                { grep -F 'POST /accounts/login/' logs/access.log 2>/dev/null || true; } \
                  | awk -v s="$since" '{ if ($4 ~ /^\[/) { split($4, a, "[/:\\[]"); m["Jan"]="01";m["Feb"]="02";m["Mar"]="03";m["Apr"]="04";m["May"]="05";m["Jun"]="06";m["Jul"]="07";m["Aug"]="08";m["Sep"]="09";m["Oct"]="10";m["Nov"]="11";m["Dec"]="12"; d=a[4] "-" m[a[3]] "-" a[2]; if (d>=s) print d " " a[5] ":" a[6] " 応答=" $9 " " ($0 ~ /iPhone|iPad/ ? "iPhone/iPad" : $0 ~ /Android/ ? "Android" : $0 ~ /Windows/ ? "Windows" : $0 ~ /Macintosh/ ? "Mac" : "その他") "/" ($0 ~ /Edg/ ? "Edge" : $0 ~ /CriOS|Chrome/ ? "Chrome" : $0 ~ /Firefox/ ? "Firefox" : $0 ~ /Safari/ ? "Safari" : "不明") } }' \
                  | tail -n 60
                echo "== スマホ（iPhone/iPad/Android）からの画面の流れ（access.log、直近 3 日。static・media・healthz を除く。時刻 メソッド パス 応答 端末。? より後ろと、合い言葉・番号らしい部分は *** に伏せる） =="
                since3=$(date -d '3 days ago' '+%Y-%m-%d' 2>/dev/null || echo 0000-00-00)
                awk -v s="$since3" '{ if ($4 ~ /^\[/ && ($0 ~ /iPhone|iPad|Android/) && $7 !~ /^\/(static|media|healthz)/) { split($4, a, "[/:\\[]"); m["Jan"]="01";m["Feb"]="02";m["Mar"]="03";m["Apr"]="04";m["May"]="05";m["Jun"]="06";m["Jul"]="07";m["Aug"]="08";m["Sep"]="09";m["Oct"]="10";m["Nov"]="11";m["Dec"]="12"; d=a[4] "-" m[a[3]] "-" a[2]; if (d>=s) print d " " a[5] ":" a[6] ":" a[7] " " $6 " " $7 " " $9 " " ($0 ~ /iPhone|iPad/ ? "iPhone/iPad" : "Android") "/" ($0 ~ /CriOS|Chrome/ ? "Chrome" : $0 ~ /Safari/ ? "Safari" : "不明") } }' logs/access.log 2>/dev/null | python3 -c 'import re, sys; t = lambda s: (len(s) >= 8 and re.search(r"[0-9]", s) and re.search(r"[A-Za-z]", s)) or (len(s) >= 12 and re.search(r"[A-Z:=%]", s)) or re.fullmatch(r"[0-9]{6,}", s); [sys.stdout.write(re.sub(r"/([^/ ]+)", lambda m: "/***" if t(m.group(1)) else "/" + m.group(1), re.sub(r"\?[^ ]*", "", line))) for line in sys.stdin]' | tail -n 120 || true
                echo "== ログインの記録（直近 7 日。種類・端末・ユーザー名の違い） =="
                python manage.py shell -v 0 -c "import datetime; from django.utils import timezone; from accounts.models import LoginEvent, StaffAccount; names = {u.username for u in StaffAccount.objects.all()}; lower = {n.lower(): n for n in names}; [print(timezone.localtime(e.created_at).strftime('%m-%d %H:%M'), e.get_kind_display(), '|', ('iPhone/iPad' if ('iPhone' in e.user_agent or 'iPad' in e.user_agent) else 'Android' if 'Android' in e.user_agent else 'Windows' if 'Windows' in e.user_agent else 'Mac' if 'Macintosh' in e.user_agent else 'その他'), '|', ('ユーザー名は登録どおり' if e.username in names else '大文字小文字・空白だけ違う' if e.username.strip().lower() in lower else '登録のないユーザー名' if e.username else '（ユーザー名なし）')) for e in LoginEvent.objects.filter(created_at__gte=timezone.now() - datetime.timedelta(days=7)).order_by('created_at')[:80]]" ;;
              error_log)
                # 公開リポジトリのログに出るので、日本語（利用者名など）と 6 桁以上の数字は伏せ、技術的な行だけにする
                for f in logs/error.log logs/gunicorn.out; do
                  echo "== $f（直近 120 行のうち Traceback・File・Error の行） =="
                  tail -n 400 "$f" 2>/dev/null | grep -E "Traceback|^  File |Error|Exception|Warning|\[[0-9]+\] \[(ERROR|CRITICAL|WARNING)\]" | tail -n 120 \
                    | LC_ALL=C sed -E 's/[^\x00-\x7F]/*/g; s/[0-9]{6,}/#/g; s/\*{4,}/***/g' || echo "(無し)"
                done
                echo "== 空き容量 =="; df -h "$APP_DIR" /tmp 2>/dev/null | tail -n 2; du -sh media 2>/dev/null ;;
              set_media_root)
                target="$APP_DIR/media"
                mkdir -p "$target"
                if grep -q '^MEDIA_ROOT=' .env; then sed -i "s#^MEDIA_ROOT=.*#MEDIA_ROOT=$target#" .env; else echo "MEDIA_ROOT=$target" >> .env; fi
                echo "MEDIA_ROOT を $target にしました"
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --restart ;;
              status)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --status ;;
              autostart_check)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --autostart check ;;
              autostart_install)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --autostart install ;;
              backup)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --backup run ;;
              backup_list)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --backup list ;;
              backup_check)
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --backup check ;;
              disable_logins|enable_logins)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください（list で確認）"; exit 1; }
                # 事業所の職員をまとめて無効／有効にする（ユーザー名は出さず、件数だけ）
                FACILITY_ID="$FACILITY_ID" TASK="$TASK" python manage.py shell -c "import os; from facilities.models import Facility; from accounts.models import StaffAccount; f = Facility.objects.get(pk=os.environ['FACILITY_ID']); on = os.environ['TASK'] == 'enable_logins'; n = StaffAccount.objects.filter(facility=f, is_active=not on).update(is_active=on); print(f'施設 {f.pk}「{f.name}」の職員アカウント {n} 件を', '有効に戻しました' if on else '無効にしました（ログインできません）')" ;;
              security_check)
                # 読み取りだけ。秘密の値は出さない（長さ・あるかないか・権限だけ）
                envv() { grep -E "^$1=" .env | tail -n 1 | cut -d= -f2- | tr -d '"' || true; }
                perm() { stat -c '%a %U' "$1" 2>/dev/null || echo "(なし)"; }
                echo "== .env =="
                echo ".env の権限: $(perm .env)（600 であること）"
                echo "DEBUG=$(envv DEBUG)  SECURE_SSL_REDIRECT=$(envv SECURE_SSL_REDIRECT)  ALLOWED_HOSTS=$(envv DJANGO_ALLOWED_HOSTS)  CSRF_TRUSTED_ORIGINS=$(envv CSRF_TRUSTED_ORIGINS)"
                echo "ALLOW_FACILITY_SIGNUP=$(envv ALLOW_FACILITY_SIGNUP)  SIGNUP_CODE: $([ -n "$(envv SIGNUP_CODE)" ] && echo あり || echo 空)  GUNICORN_BIND_HOST=$(envv GUNICORN_BIND_HOST)  DJANGO_SETTINGS_MODULE=$(envv DJANGO_SETTINGS_MODULE)"
                k=$(envv SECRET_KEY); echo "SECRET_KEY の長さ: ${#k}  DB_PASSWORD の長さ: $(v=$(envv DB_PASSWORD); echo ${#v})  DB_HOST=$(envv DB_HOST)  DB_USER=$(envv DB_USER)"
                echo "MOBILE_API_CORS_ORIGINS=$(envv MOBILE_API_CORS_ORIGINS)  EMAIL_HOST: $([ -n "$(envv EMAIL_HOST)" ] && echo あり || echo 空)  ANTHROPIC_API_KEY: $([ -n "$(envv ANTHROPIC_API_KEY)" ] && echo あり || echo 空)"
                echo "== 置き場所の権限（同じサーバーのほかの利用者から読めないか）=="
                echo "ホーム: $(perm "$HOME")  置き場所: $(perm "$APP_DIR")  media: $(perm "$(envv MEDIA_ROOT | sed "s#^~#$HOME#")")  backups: $(perm backups)  logs: $(perm logs)  run: $(perm run)  venv: $(perm "$VENV")"
                echo "ほかの利用者が読めるファイルの数（置き場所の直下 2 段。.git・staticfiles を除く）: $(find . -maxdepth 2 -not -path './.git*' -not -path './staticfiles*' -type f -perm -o+r 2>/dev/null | wc -l)"
                echo "ほかの利用者が読める media のファイル: $(find "$(envv MEDIA_ROOT | sed "s#^~#$HOME#")" -type f -perm -o+r 2>/dev/null | wc -l)  backups のファイル: $(find backups -type f -perm -o+r 2>/dev/null | wc -l)  ログ: $(find logs -type f -perm -o+r 2>/dev/null | wc -l)"
                echo "ほかの利用者が書ける場所: $(find . -maxdepth 3 -not -path './.git*' -perm -o+w -not -type l 2>/dev/null | wc -l)"
                echo "== 待ち受け =="
                APP_DIR="$APP_DIR" VENV="$VENV" bash deploy/venv-deploy.sh --status | grep -E "gunicorn:|bind:|healthz|settings:|code:" || true
                (ss -ltnH 2>/dev/null || netstat -ltn 2>/dev/null) | awk '{print $4}' | grep -E ":(8049|8050)$" | sed 's/^/待ち受け中: /' || true
                echo "== 取得元・自動起動 =="
                git remote get-url origin | sed -E 's#//[^/@]+@#//***@#' | sed 's/^/origin: /'
                echo "crontab のこの置き場所の行: $(crontab -l 2>/dev/null | grep -cF "$APP_DIR/deploy/venv-deploy.sh" || true)"
                echo "== Django の配備向けの確認 =="
                python manage.py check --deploy 2>&1 | tail -n 12
                echo "== 部品の版 =="
                python --version; pip list --format=freeze 2>/dev/null | grep -i -E "^(django|gunicorn|brotli|pillow|whitenoise|requests|urllib3|psycopg2-binary|weasyprint|cryptography|anthropic)==" | tr '\n' ' '; echo
                echo "== アカウント（数だけ）=="
                python manage.py shell -v 0 -c "if True:
                from accounts.models import StaffAccount
                from django.conf import settings
                def _ok(i):
                    try:
                        ipaddress.ip_address(i); return True
                    except ValueError:
                        return False
                q = StaffAccount.objects
                print('職員:', q.count(), '| 使える:', q.filter(is_active=True).count(), '| superuser:', q.filter(is_superuser=True).count(), '| is_staff:', q.filter(is_staff=True).count(), '| パスワードなし:', sum(1 for u in q.all() if not u.has_usable_password()))
                print('DEBUG:', settings.DEBUG, '| ALLOWED_HOSTS:', settings.ALLOWED_HOSTS, '| SESSION_COOKIE_SECURE:', settings.SESSION_COOKIE_SECURE, '| CSRF_COOKIE_SECURE:', settings.CSRF_COOKIE_SECURE, '| HSTS:', settings.SECURE_HSTS_SECONDS, '| SESSION_COOKIE_AGE:', settings.SESSION_COOKIE_AGE, '| SESSION_COOKIE_HTTPONLY:', settings.SESSION_COOKIE_HTTPONLY, '| SAMESITE:', settings.SESSION_COOKIE_SAMESITE, '| PROXY_SSL_HEADER:', settings.SECURE_PROXY_SSL_HEADER, '| X_FRAME:', settings.X_FRAME_OPTIONS)
                from accounts.models import LoginEvent
                import ipaddress
                ips = [i for i in LoginEvent.objects.order_by('-created_at').values_list('ip', flat=True)[:200] if i]
                inner = sum(1 for i in ips if (lambda a: a.is_private or a.is_loopback)(ipaddress.ip_address(i)) ) if all(_ok(i) for i in ips) else -1
                print('ログインの記録の接続元（直近', len(ips), '件）: 種類', len(set(ips)), '| 内側のアドレス（127.0.0.1 など）:', inner, '件（多ければ、nginx が接続元を渡していない）')
                print('admin が入っている:', 'django.contrib.admin' in settings.INSTALLED_APPS, '| ROOT_URLCONF:', settings.ROOT_URLCONF)
                try:
                    from family.models import FamilyAccount
                    f = FamilyAccount.objects
                    print('保護者アカウント:', f.count(), '| 使える:', f.filter(is_active=True).count(), '| ロック中:', sum(1 for a in f.all() if a.is_locked))
                except Exception as e:
                    print('保護者アカウント: 見られない', type(e).__name__)
                " ;;
              family_page_on|family_page_off)
                [ -n "$FACILITY_ID" ] || { echo "facility_id を入れてください（list で確認）"; exit 1; }
                args=(family_page --facility "$FACILITY_ID")
                [ "$TASK" = "family_page_off" ] && args+=(--off)
                python manage.py "${args[@]}" ;;
              *) echo "unknown task: $TASK"; exit 1 ;;
            esac
          REMOTE
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s

      - name: Security check from outside (read-only, a few dozen requests)
        if: inputs.task == 'security_check'
        env:
          TARGET: ${{ inputs.target }}
          APP: ${{ inputs.app }}
        run: |
          D="$([ "$TARGET" = prod ] || echo st-)naru$([ "$APP" = family ] && echo -family || true).ai-labo.cloud"
          PORT=$([ "$APP" = family ] && echo 8050 || echo 8049)
          UA="naru-security-check"
          code() { curl -s -o /dev/null -A "$UA" -w '%{http_code}' --max-time 15 "$@" || true; }
          echo "== 対象: https://$D/ =="
          echo "-- http → https"
          curl -s -o /dev/null -A "$UA" --max-time 15 -w 'http://  → %{http_code} %{redirect_url}\n' "http://$D/" || true
          echo "-- TLS"
          for v in tls1 tls1_1 tls1_2 tls1_3; do
            if echo | timeout 15 openssl s_client -connect "$D:443" -servername "$D" -"$v" >/tmp/tls.txt 2>/dev/null && grep -q "Cipher is" /tmp/tls.txt && ! grep -q "Cipher is (NONE)" /tmp/tls.txt; then
              echo "$v: 受ける（$(grep -m1 'Cipher is' /tmp/tls.txt | sed 's/.*Cipher is //')）"; else echo "$v: 受けない"; fi
          done
          echo | timeout 15 openssl s_client -connect "$D:443" -servername "$D" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null | sed 's/^/証明書 /' || true
          echo "-- 応答のヘッダー（ログインの画面）"
          LOGIN=$([ "$APP" = family ] && echo /login/ || echo /accounts/login/)
          curl -s -D /tmp/h.txt -o /tmp/b.html -A "$UA" --max-time 15 "https://$D$LOGIN" || true
          head -n 1 /tmp/h.txt
          for h in strict-transport-security x-frame-options x-content-type-options referrer-policy content-security-policy permissions-policy cross-origin-opener-policy cache-control server x-powered-by; do
            v=$(grep -i "^$h:" /tmp/h.txt | head -n 1 | tr -d '\r' | cut -d: -f2- || true); echo "$h:${v:- （なし）}"
          done
          grep -i '^set-cookie:' /tmp/h.txt | sed -E 's/=[^;]*/=***/' | tr -d '\r' || echo "set-cookie: （なし）"
          echo "-- 出てはいけないもの（404 か 403・ログインへの転送ならよい）"
          for p in /.env /.git/config /.git/HEAD /db.sqlite3 /backups/ /logs/error.log /logs/access.log /requirements.txt /manage.py /deploy/venv-deploy.sh /static/ /media/ /admin/ /admin/login/ /server-status /phpinfo.php /.well-known/security.txt /robots.txt; do
            echo "$p → $(code "https://$D$p")"
          done
          echo "-- ログインなしで開く（職員・保護者の画面と API）"
          for p in / /home/ /users/ /users/1/ /family/staff/inbox/ /family/staff/book/ /family/ /family/from/ /api/mobile/v1/me/ /api/mobile/v1/beneficiaries/ /records/day/ /plans/renewal/ /accounts/staff/ /account/setup/x/ /healthz/; do
            curl -s -o /dev/null -A "$UA" --max-time 15 -w "$p → %{http_code} %{redirect_url}\n" "https://$D$p" || true
          done
          echo "-- healthz の中身（先頭 200 字）"; curl -s -A "$UA" --max-time 15 "https://$D/healthz/" | head -c 200; echo
          echo "-- 無いページの出かた（DEBUG の情報が出ていないか）"
          curl -s -A "$UA" --max-time 15 "https://$D/this-page-does-not-exist-$RANDOM/" > /tmp/404.html || true
          echo "404 の大きさ: $(wc -c < /tmp/404.html) バイト  DEBUG の表示: $(grep -c -i -E 'Traceback|DEBUG = True|Request Method|urlpatterns|Django tried these URL' /tmp/404.html || true) 件"
          echo "-- ホスト名の偽装（400 ならよい）"
          echo "Host: evil.example → $(code -H 'Host: evil.example' "https://$D$LOGIN" -k)"
          echo "X-Forwarded-Host: evil.example → $(curl -s -A "$UA" --max-time 15 -H 'X-Forwarded-Host: evil.example' "https://$D$LOGIN" | grep -c 'evil.example' || true) 件の反映"
          echo "-- CSRF（トークンなしの送信。403 ならよい）"
          echo "POST $LOGIN → $(code -X POST -d 'username=x&password=x&email=x@example.test' "https://$D$LOGIN")"
          echo "-- メソッド"
          echo "TRACE → $(code -X TRACE "https://$D/")  OPTIONS → $(code -X OPTIONS "https://$D/")"
          echo "-- アプリのポートが外から直に開くか（つながらなければよい）"
          for pt in 8049 8050; do echo "http://$D:$pt/ → $(curl -s -o /dev/null -A "$UA" -w '%{http_code}' --connect-timeout 6 --max-time 8 "http://$D:$pt/healthz/" || true)"; done
          echo "-- CORS（よそのサイトからの読み取りを許していないか）"
          curl -s -o /dev/null -D - -A "$UA" --max-time 15 -H 'Origin: https://evil.example' "https://$D/api/mobile/v1/me/" | grep -i '^access-control-' | tr -d '\r' || echo "access-control-*: （なし）"
          echo "-- 画面の中の外部の部品（CDN）に、改ざんの検知（integrity）が付いているか"
          echo "外部の script/link: $(grep -o -i -E '<(script|link)[^>]+https?://[^>]+>' /tmp/b.html | wc -l) 件  うち integrity つき: $(grep -o -i -E '<(script|link)[^>]+https?://[^>]+>' /tmp/b.html | grep -c -i integrity || true) 件"
          grep -o -i -E '<(script|link)[^>]+https?://[^"'"'"' >]+' /tmp/b.html | grep -o -E 'https?://[^/"]+' | sort | uniq -c | sed 's/^/  /' || true

